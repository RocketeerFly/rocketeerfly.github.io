<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Workflow System — Bài Kiểm Tra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #08090d;
    --surface:  #0f1017;
    --card:     #141520;
    --border:   #1e2133;
    --green:    #00e87a;
    --cyan:     #00c8f0;
    --amber:    #f0a500;
    --red:      #ff4566;
    --text:     #d4d8f0;
    --muted:    #5a6080;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'DM Sans', sans-serif;
  }

  html { font-size: 16px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,.06) 2px, rgba(0,0,0,.06) 4px
    );
    pointer-events: none; z-index: 9999;
  }

  /* Corner grid decoration */
  .grid-bg {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,232,122,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,232,122,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* ── Layout ── */
  .shell {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
  }

  /* ── Header ── */
  .header {
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 28px;
  }
  .tag {
    font-family: var(--mono);
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--green);
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 14px;
  }
  .tag::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }

  h1 {
    font-family: var(--mono);
    font-size: 1.55rem; font-weight: 700;
    line-height: 1.2; color: #fff;
    letter-spacing: -.02em;
    margin-bottom: 10px;
  }
  h1 span { color: var(--green); }
  .subtitle {
    font-size: .9rem; color: var(--muted); line-height: 1.6;
    max-width: 520px;
  }

  /* ── Progress bar ── */
  .progress-wrap {
    margin-bottom: 32px;
  }
  .progress-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: .72rem; color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-meta .qnum { color: var(--cyan); font-weight: 600; }
  .progress-track {
    height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan));
    border-radius: 2px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 10px rgba(0,232,122,.4);
  }

  /* ── Section label ── */
  .section-label {
    font-family: var(--mono); font-size: .7rem; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--amber); margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  /* ── Question card ── */
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    margin-bottom: 16px;
    animation: fadeUp .3s ease both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(12px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .q-index {
    font-family: var(--mono); font-size: .68rem; color: var(--muted);
    margin-bottom: 12px;
  }
  .q-text {
    font-size: 1rem; font-weight: 500; line-height: 1.65;
    color: #e8ecff; margin-bottom: 22px;
  }

  /* ── Options ── */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 13px 16px;
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    transition: border-color .18s, background .18s, transform .12s;
    background: var(--surface);
  }
  .option:hover { border-color: var(--cyan); background: rgba(0,200,240,.06); transform: translateX(3px); }

  .opt-label {
    font-family: var(--mono); font-size: .78rem; font-weight: 700;
    color: var(--muted); min-width: 20px; margin-top: 1px;
    transition: color .18s;
  }
  .opt-text { font-size: .9rem; line-height: 1.55; color: var(--text); }

  /* States */
  .option.selected   { border-color: var(--cyan); background: rgba(0,200,240,.1); }
  .option.selected .opt-label { color: var(--cyan); }

  .option.correct    { border-color: var(--green); background: rgba(0,232,122,.1); pointer-events: none; }
  .option.correct .opt-label { color: var(--green); }

  .option.wrong      { border-color: var(--red); background: rgba(255,69,102,.1); pointer-events: none; }
  .option.wrong .opt-label  { color: var(--red); }

  .option.reveal-correct { border-color: rgba(0,232,122,.5); background: rgba(0,232,122,.05); pointer-events: none; }
  .option.reveal-correct .opt-label { color: rgba(0,232,122,.6); }

  .option.dimmed { opacity: .35; pointer-events: none; }

  /* ── Explanation ── */
  .explanation {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 7px;
    border-left: 3px solid var(--green);
    background: rgba(0,232,122,.06);
    font-size: .88rem; line-height: 1.65;
    color: #a8b8d8;
    animation: fadeUp .25s ease both;
    display: none;
  }
  .explanation.wrong-exp { border-color: var(--red); background: rgba(255,69,102,.06); }
  .explanation strong { color: var(--green); font-weight: 600; }
  .explanation.wrong-exp strong { color: var(--red); }

  /* ── Buttons ── */
  .btn {
    font-family: var(--mono); font-size: .8rem; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 11px 24px; border-radius: 6px; border: none;
    cursor: pointer; transition: all .18s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-primary {
    background: var(--green); color: #000;
    box-shadow: 0 0 20px rgba(0,232,122,.3);
  }
  .btn-primary:hover { background: #00ff88; box-shadow: 0 0 30px rgba(0,232,122,.5); }
  .btn-primary:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }

  .btn-ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--cyan); color: var(--cyan); }

  .nav-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 24px;
  }

  /* ── Score screen ── */
  #score-screen { display: none; }

  .score-hero {
    text-align: center; padding: 48px 24px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 24px;
  }
  .score-ring {
    width: 140px; height: 140px; margin: 0 auto 24px;
    position: relative;
  }
  .score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .score-ring .track { fill: none; stroke: var(--border); stroke-width: 8; }
  .score-ring .fill  {
    fill: none; stroke-width: 8; stroke-linecap: round;
    stroke-dasharray: 377; stroke-dashoffset: 377;
    transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1) .3s;
  }
  .score-number {
    position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--mono);
  }
  .score-number .big { font-size: 2.2rem; font-weight: 700; color: #fff; }
  .score-number .denom { font-size: .75rem; color: var(--muted); }

  .score-title {
    font-family: var(--mono); font-size: 1.2rem;
    font-weight: 700; color: #fff; margin-bottom: 8px;
  }
  .score-sub { font-size: .88rem; color: var(--muted); }

  .breakdown {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-bottom: 24px;
  }
  .breakdown-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 9px; padding: 18px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .breakdown-card .bd-label { font-size: .72rem; color: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
  .breakdown-card .bd-val { font-size: 1.8rem; font-weight: 700; font-family: var(--mono); }
  .bd-green .bd-val { color: var(--green); }
  .bd-red   .bd-val { color: var(--red); }

  .review-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .review-item {
    padding: 12px 16px;
    border-radius: 7px; border: 1px solid var(--border);
    font-size: .85rem; display: flex; align-items: flex-start; gap: 10px;
  }
  .review-item .ri-icon { font-size: 1rem; min-width: 20px; margin-top: 1px; }
  .review-item .ri-q { color: var(--text); line-height: 1.5; }
  .review-item .ri-ans { font-size: .78rem; color: var(--muted); margin-top: 3px; }
  .review-item.r-correct { border-color: rgba(0,232,122,.3); }
  .review-item.r-wrong   { border-color: rgba(255,69,102,.3); }

  .restart-row { text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="shell">
  <!-- Header -->
  <div class="header">
    <div class="tag">Bài kiểm tra</div>
    <h1>AI Workflow <span>System</span></h1>
    <p class="subtitle">Kiểm tra hiểu biết về kiến trúc xây dựng agent workflow — từ nền tảng đến nguyên tắc cốt lõi. 75 câu hỏi, 2 phần.</p>
  </div>

  <!-- Quiz -->
  <div id="quiz-screen">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span class="qnum" id="q-counter">Câu 1 / 20</span>
        <span id="q-section-tag">Phần 1: Kiến thức nền tảng</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:5%"></div>
      </div>
    </div>

    <div id="section-label-wrap"></div>
    <div id="question-area"></div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="btn-prev">← Trước</button>
      <button class="btn btn-primary" id="btn-next" disabled>Tiếp theo →</button>
    </div>
  </div>

  <!-- Score -->
  <div id="score-screen">
    <div class="score-hero">
      <div class="score-ring">
        <svg viewBox="0 0 130 130">
          <circle class="track" cx="65" cy="65" r="60"/>
          <circle class="fill" id="score-arc" cx="65" cy="65" r="60"/>
        </svg>
        <div class="score-number">
          <span class="big" id="score-big">0</span>
          <span class="denom">/ 75</span>
        </div>
      </div>
      <div class="score-title" id="score-title"></div>
      <div class="score-sub" id="score-sub"></div>
    </div>

    <div class="breakdown">
      <div class="breakdown-card bd-green">
        <span class="bd-label">ĐÚNG</span>
        <span class="bd-val" id="bd-correct">0</span>
      </div>
      <div class="breakdown-card bd-red">
        <span class="bd-label">SAI</span>
        <span class="bd-val" id="bd-wrong">0</span>
      </div>
    </div>

    <div class="section-label">Xem lại tất cả câu</div>
    <div class="review-list" id="review-list"></div>

    <div class="restart-row">
      <button class="btn btn-primary" onclick="restartQuiz()">↺ Làm lại từ đầu</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  // ────────────────────────────────────────────────────────────
  //  PHẦN 1 — Kiến thức nền tảng (25 câu)
  // ────────────────────────────────────────────────────────────
  {
    part: 1,
    text: "Context window trong một LLM (Large Language Model) là gì?",
    options: [
      "Cửa sổ hiển thị code của IDE khi đang dùng AI assistant",
      "Bộ nhớ dài hạn của model — lưu mọi thứ vĩnh viễn qua các session",
      "Giới hạn tổng số tokens mà model có thể xử lý trong một lần tương tác",
      "Số lượng file mà AI có thể đọc đồng thời trên disk"
    ],
    correct: 2,
    explanation: "<strong>Đúng.</strong> Context window là \"bộ nhớ làm việc\" của model trong 1 request — khi conversation kết thúc hoặc vượt giới hạn, mọi thứ trong đó biến mất. Đây là lý do tại sao state phải được persist ra file, không thể sống trong chat."
  },
  {
    part: 1,
    text: "Trong kiến trúc Orchestrator-Worker, nhiệm vụ chính của Orchestrator là gì?",
    options: [
      "Thực thi công việc cụ thể, viết code, và produce artifacts",
      "Điều phối, route task, và monitor kết quả từ các worker agents",
      "Lưu trữ toàn bộ state của hệ thống vào database",
      "Validate input/output của mỗi worker sau khi hoàn thành"
    ],
    correct: 1,
    explanation: "<strong>Đúng.</strong> Orchestrator mỏng, không làm việc thật. Nó chỉ: kiểm tra state → spawn agent phù hợp → đợi completion marker → route tiếp. Nếu orchestrator bắt đầu \"nghĩ\" và phân tích thay vì route, đó là dấu hiệu thiết kế sai."
  },
  {
    part: 1,
    text: "Idempotency trong thiết kế hệ thống có nghĩa là gì?",
    options: [
      "API luôn trả về response trong dưới 100ms dù load thế nào",
      "Hệ thống có thể xử lý hàng nghìn concurrent requests",
      "Gọi cùng một operation nhiều lần cho kết quả giống nhau như gọi 1 lần",
      "Hệ thống tự động retry và recover khi gặp lỗi network"
    ],
    correct: 2,
    explanation: "<strong>Đúng.</strong> Idempotency cực kỳ quan trọng trong workflow hệ thống — nếu 1 bước chạy 2 lần (do retry, crash, hay restart), kết quả phải giống nhau. Ví dụ: tạo file STATE.md lần 2 không được ghi đè dữ liệu cũ mà không cảnh báo."
  },
  {
    part: 1,
    text: "Race condition là gì và tại sao nó nguy hiểm trong hệ thống multi-agent?",
    options: [
      "Hệ thống bị chậm vì server quá tải — cần scale up",
      "Lỗi xảy ra khi 2+ process đọc/ghi cùng shared resource đồng thời, dẫn đến kết quả không xác định",
      "Timeout khi network latency quá cao giữa orchestrator và worker",
      "Memory leak do agent không giải phóng bộ nhớ sau khi xong"
    ],
    correct: 1,
    explanation: "<strong>Đúng.</strong> Khi 2 agent song song cùng ghi STATE.md, bên nào ghi sau sẽ xóa kết quả bên kia. Đây là lý do GSD dùng CLI tool (gsd-tools.cjs) thay vì để agent tự ghi trực tiếp — CLI serialize các write operations."
  },
  {
    part: 1,
    text: "\"Contract\" trong lập trình (API contract, agent contract) là gì?",
    options: [
      "Hợp đồng license phần mềm giữa vendor và client",
      "Test suite đầy đủ bao gồm unit test và integration test",
      "Tài liệu kiến trúc mô tả toàn bộ hệ thống",
      "Thỏa thuận rõ ràng về input/output format và behavior giữa 2 hệ thống"
    ],
    correct: 3,
    explanation: "<strong>Đúng.</strong> Contract là giao ước: \"Nếu mày cung cấp X theo format Y, tao sẽ trả về Z theo format W.\" Trong hệ thống agent, thiếu contract rõ ràng dẫn đến việc caller không biết cách parse output, và agent không biết gì cần produce."
  },
  {
    part: 1,
    text: "Khi nói \"state phải persist trên disk\" — điều này giải quyết vấn đề gì?",
    options: [
      "Performance — đọc từ disk nhanh hơn gọi API sang server",
      "Security — dữ liệu không bị intercept qua network",
      "Durability — state không bị mất khi process, session, hay conversation bị reset",
      "Concurrency — nhiều user có thể đọc cùng state đồng thời"
    ],
    correct: 2,
    explanation: "<strong>Đúng.</strong> AI conversation có giới hạn context. Khi bắt đầu session mới, model không nhớ gì từ session trước. State được ghi ra disk (STATE.md, ROADMAP.md...) là cách duy nhất để workflow biết \"tao đang ở đâu\" sau mỗi lần reset."
  },
  {
    part: 1,
    text: "Schema trong context của file/data format là gì?",
    options: [
      "Diagram ER mô tả quan hệ giữa các database tables",
      "Định nghĩa cấu trúc bắt buộc mà một piece of data phải tuân theo",
      "Documentation được auto-generate từ code comments",
      "Template UI cho các form nhập liệu"
    ],
    correct: 1,
    explanation: "<strong>Đúng.</strong> Schema là \"bản thiết kế\" của data. Ví dụ PLAN.md schema trong GSD bắt buộc có: frontmatter, &lt;objective&gt;, &lt;tasks&gt; với verify + acceptance_criteria, &lt;success_criteria&gt;. Nếu thiếu một field, consumer không parse được và workflow bị vỡ."
  },
  {
    part: 1,
    text: "\"Few-shot prompting\" trong prompt engineering là gì?",
    options: [
      "Gửi nhiều prompt ngắn liên tiếp thay vì một prompt dài",
      "Giới hạn số token trong response để tiết kiệm chi phí",
      "Cung cấp ví dụ mẫu (input → output) trong prompt để hướng dẫn model",
      "Chia prompt thành nhiều lần gọi API riêng biệt rồi gộp kết quả"
    ],
    correct: 2,
    explanation: "<strong>Đúng.</strong> Few-shot prompting = cho model xem 2-5 ví dụ \"input → output mong muốn\" trước câu hỏi thật. Rất hiệu quả để fix output inconsistency vì model học pattern từ ví dụ, không phải từ description trừu tượng."
  },
  {
    part: 1,
    text: "Tại sao \"artifact\" (file output có structure) quan trọng hơn \"chat response\" trong hệ thống AI workflow?",
    options: [
      "Artifact nhanh hơn và tốn ít token hơn để generate",
      "Artifact có structure cố định, persist qua sessions, và có thể được automation parse và xử lý",
      "Artifact được encrypt tự động nên bảo mật hơn",
      "Artifact dễ debug hơn vì có thể đọc trực tiếp bằng text editor"
    ],
    correct: 1,
    explanation: "<strong>Đúng.</strong> Chat response là ephemeral (biến mất khi session reset) và unstructured (khó parse bằng code). Artifact như PLAN.md hay SUMMARY.md có schema cố định, sống trên disk, và downstream agent có thể đọc theo đúng format đã biết trước."
  },
  {
    part: 1,
    text: "\"Separation of concerns\" trong thiết kế AI workflow có nghĩa gì thực tế?",
    options: [
      "Mỗi file code không nên vượt quá 200 lines",
      "UI và business logic phải hoàn toàn tách biệt về layer",
      "Mỗi agent/workflow chỉ chịu trách nhiệm cho một nhiệm vụ duy nhất",
      "Database và application phải chạy trên server khác nhau"
    ],
    correct: 2,
    explanation: "<strong>Đúng.</strong> Trong GSD: researcher chỉ research, planner chỉ plan, executor chỉ execute, verifier chỉ verify. Không agent nào làm việc của agent khác. Khi 1 agent vừa plan vừa execute, nó sẽ skip verification vì \"tao biết mình làm đúng rồi\" — đây là dấu hiệu thiết kế sai."
  },

  {
    part: 1,
    text: "\"Token\" trong LLM khác \"character\" như thế nào?",
    options: [
      "Token và character là giống nhau — mỗi ký tự là 1 token",
      "Token là đơn vị xử lý của model, có thể là 1 từ, một phần từ, hoặc dấu câu — không phải ký tự đơn lẻ",
      "Token là unit thanh toán API, còn character là unit xử lý nội bộ",

      "Structured logging dùng XML; plain text dùng string",
      "Structured logging output JSON/key-value pairs — machine-parseable, filterable, aggregatable; plain text phải dùng regex để extract data — brittle và không scale",
      "Structured logging ghi vào database; plain text ghi vào file",
      "Structured logging chỉ cho production; plain text cho development"
    ],
    correct: 1,
    explanation: '<strong>Đúng.</strong> Plain: "Agent started task add-auth at 14:32". Structured: {"event": "task_start", "agent": "executor", "task": "add-auth", "timestamp": "14:32"}. Với structured logs: query "show all tasks by executor agent that took > 5min" = trivial. Với plain text = regex nightmare. Frontmatter là structured logging cho workflow artifacts.'
  },
  {
    part: 2,
    text: 'Graceful degradation trong system design là gì?',
    options: [
      "Hệ thống tự động scale down khi traffic giảm",
      "Khi 1 component fail, hệ thống tiếp tục hoạt động với reduced functionality thay vì crash hoàn toàn — user vẫn dùng được core features",
      "Thông báo maintenance window trước khi downtime",
      "Migration strategy khi deprecated API bị remove"
    ],
    correct: 1,
    explanation: "<strong>Đúng.</strong> Gmail khi offline: vẫn đọc được cached emails dù không gửi được. Trong AI workflow: nếu verifier agent fail, workflow có thể degrade gracefully = mark phase cần manual review thay vì abort toàn bộ. Ngược với graceful degradation là fail loudly — cả hai đều valid, quan trọng là chọn đúng context."
  },
  {
    part: 2,
    text: 'Idempotency key trong API design giải quyết vấn đề gì?',
    options: [
      "Unique key để identify user session",
      "Client gửi unique key cùng request — server dùng key đó để detect duplicate requests và trả về cached response, tránh side effects khi retry cùng operation",
      "API key để authenticate client",
      "Cache key để store response"
    ],
    correct: 1,
    explanation: "<strong>Đúng.</strong> Charge thẻ $100, response timeout, client không biết có charge chưa, retry = charge 2 lần. Với idempotency key: retry cùng key → server biết đã process → trả cached result, không charge lần 2. Trong workflow: mỗi task có ID → nếu agent crash và restart, check ID trước khi execute để không làm 2 lần."
  },
  {
    part: 2,
    text: 'Lock file (package-lock.json, yarn.lock, Gemfile.lock) mục đích là gì?',
    options: [
      "Prevent other developers from editing package.json simultaneously",
      "Ghi lại exact version của mọi dependency (bao gồm transitive dependencies) để đảm bảo mọi machine/environment install đúng cùng versions — reproducible builds",
      "Lock package.json để CI/CD không thể tự ý update dependencies",
      "Encrypt dependency list để bảo vệ intellectual property"
    ],
    correct: 1,
    explanation: '<strong>Đúng.</strong> package.json nói "react >= 18" → developer A install 18.0, developer B install 18.2 → different behavior. Lock file pin chính xác 18.2.0 cho mọi người. Concept này áp dụng cho workflow: nếu agent prompt depend on gsd v2.x, pin exact version trong config để tất cả environments dùng cùng behavior.'
  },
  {
    part: 2,
    text: 'Eventual consistency là gì và khi nào chấp nhận được?',
    options: [
      "Hệ thống eventually sẽ có bugs nếu không maintain thường xuyên",
      "Các nodes trong distributed system sẽ đồng bộ về cùng state SAU MỘT KHOẢNG THỜI GIAN — không đảm bảo immediate consistency nhưng đảm bảo convergence cuối cùng",
      "Database replica sẽ eventually catch up với primary",
      "Test suite eventually sẽ pass nếu chạy đủ nhiều lần"
    ],
    correct: 1,
    explanation: "<strong>Đúng.</strong> DNS propagation là eventual consistency: update DNS record, không phải ngay lập tức mọi server thấy, nhưng sau vài giờ thì đều thấy. Trong workflow: 2 parallel agents update ROADMAP tại T1 và T2 — ngay lúc đó có thể inconsistent, nhưng sau khi merge xong thì consistent. Eventual consistency OK khi không cần strong real-time guarantees."
  },
  {
    part: 2,
    text: 'Two-phase commit (2PC) giải quyết vấn đề gì và trade-off của nó là gì?',
    options: [
      "Optimize database query bằng cách chia thành 2 phases: parse và execute",
      "Đảm bảo distributed transaction: phase 1 = tất cả participants vote yes/no; phase 2 = nếu tất cả yes thì commit, 1 no thì abort tất cả. Trade-off: blocking nếu coordinator crash",
      "Deploy strategy: phase 1 = staging, phase 2 = production",
      "Code review process: phase 1 = automated checks, phase 2 = human review"
    ],
    correct: 1,
    explanation: '<strong>Đúng.</strong> 2PC đảm bảo atomicity across multiple systems: hoặc tất cả commit, hoặc tất cả rollback. Trade-off: nếu coordinator crash sau phase 1, tất cả participants bị block chờ quyết định. Trong AI workflow: "tất cả plans trong phase phải complete hoặc không cái nào" — đây là tinh thần 2PC, thực thi qua checkpoint trước khi advance.'
  },
  {
    part: 2,
    text: 'Outbox pattern giải quyết vấn đề gì trong event-driven systems?',
    options: [
      "Store outgoing emails trong database trước khi gửi",
      'Đảm bảo database write và event publish là atomic: ghi event vào outbox table TRONG CÙNG transaction với data change, background process đọc outbox và publish — tránh "data saved, event lost"',
      "Queue cho outgoing API calls đến third parties",
      "Buffer cho real-time notifications"
    ],
    correct: 1,
    explanation: "<strong>Đúng.</strong> Không có outbox: save order → service crash → event not published → inventory không được reserved. Với outbox: save order + save event in outbox = same transaction → nếu crash, khi restart outbox processor sẽ publish pending events. Trong workflow: ghi SUMMARY.md và update STATE.md là 1 transaction — làm cả hai hoặc không cái nào."
  },
  {
    part: 2,
    text: 'CQRS (Command Query Responsibility Segregation) pattern là gì?',
    options: [
      "Tách biệt SELECT queries với INSERT/UPDATE/DELETE trong SQL",
      "Tách biệt mô hình đọc (Query = optimized for reads) và mô hình ghi (Command = optimized for consistency) — mỗi bên có thể scale và optimize độc lập",
      "Design pattern cho REST API: GET cho query, POST/PUT/DELETE cho commands",
      "Separation of frontend queries từ backend business logic"
    ],
    correct: 1,
    explanation: '<strong>Đúng.</strong> Write model: "update state, validate business rules, emit events" — cần consistency. Read model: "dashboard, progress report" — cần performance, có thể stale. Trong workflow: STATE.md (write model, always consistent) vs progress dashboard (read model, có thể cache). Đừng dùng cùng 1 model cho cả reads và writes khi chúng có conflicting requirements.'
  },
  {
    part: 2,
    text: 'Trunk-based development khác feature branching ở điểm nào?',
    options: [
      "Trunk-based = 1 developer; feature branching = team",
      "Trunk-based: mọi developer commit thẳng vào main branch (trunk) hàng ngày, dùng feature flags để hide incomplete features; feature branching: mỗi feature sống trên branch riêng, merge khi xong",
      "Trunk-based cho open source; feature branching cho private repos",
      "Trunk-based dùng rebase; feature branching dùng merge commits"
    ],
    correct: 1,
    explanation: "<strong>Đúng.</strong> Feature branches tồn tại lâu → merge conflicts khổng lồ. Trunk-based: branches sống max 1-2 ngày, integrate sớm và thường xuyên → conflicts nhỏ, dễ resolve. Trong workflow: plan execution = trunk-based — mỗi task commit ngay vào main branch, không để tích lũy. Feature flags hide incomplete work."
  },
  {
    part: 2,
    text: 'Content-addressable storage là gì và tại sao git dùng nó?',
    options: [
      "Storage được đặt địa chỉ theo tên file và đường dẫn",
      "Files được lưu và truy xuất bằng hash của content — cùng content luôn cho cùng hash, khác content luôn khác hash — tự động deduplicate và verify integrity",
      "CDN lưu content gần user nhất theo địa lý",
      "Database index content của files để full-text search"
    ],
    correct: 1,
    explanation: '<strong>Đúng.</strong> Git object store: mỗi file, commit, tree có SHA-1 hash của content. 2 commits với cùng nội dung = cùng hash. Corrupt data = hash không match = detect ngay. Trong workflow artifacts: nếu PLAN.md chưa bị sửa thì hash không đổi — dùng để verify "plan này có bị ai modify không kể từ khi planner tạo ra".'
  },
  {
    part: 2,
    text: 'Strangler fig pattern là gì trong software migration?',
    options: [
      "Xóa dần legacy code sau khi viết xong replacement",
      'Dần dần thay thế legacy system bằng cách build new functionality xung quanh nó, route traffic sang new system theo từng phần, đến khi old system bị "bóp chết" và có thể remove',
      "Migrate database schema theo từng bước nhỏ",
      "A/B test 2 implementations rồi chọn cái tốt hơn"
    ],
    correct: 1,
    explanation: "<strong>Đúng.</strong> Không thể stop-the-world rewrite 5-year-old monolith trong 6 tháng. Strangler fig: route 5% traffic đến new service → 20% → 50% → 100% → decommission old. Trong workflow migration: không replace toàn bộ workflow cũ cùng lúc — thêm new phases alongside old, migrate feature-by-feature, old workflow strangled dần."
  },
  {
    part: 2,
    text: 'Hermetic build là gì và tại sao quan trọng cho reproducibility?',
    options: [
      "Build được chạy trong isolated environment không có internet access và với pinned dependencies — đảm bảo cùng input luôn cho cùng output, bất kể môi trường hay thời điểm",
      "Build được encrypt để protect source code",
      "Build chạy trong Docker container",
      "Build không có side effects trên file system"
    ],
    correct: 0,
    explanation: '<strong>Đúng.</strong> "Works on my machine" problem: build depend on system Python version, some global env var, latest version of unpinned package. Hermetic build: sandbox hoàn toàn, pin everything, no external calls. Kết quả: build từ 2 năm trước vẫn reproduce được. Trong workflow: hermetic = deterministic execution, cùng plan + cùng code = cùng result.'
  },
  {
    part: 2,
    text: 'Observer pattern vs polling — sự khác biệt và khi nào dùng cái nào?',
    options: [
      "Observer dùng cho real-time apps; polling dùng cho batch processing",
      'Polling: check trạng thái định kỳ (hỏi liên tục "xong chưa?"). Observer: register callback, được notify khi state thay đổi ("gọi tao khi xong") — Observer hiệu quả hơn nhưng cần event system',
      "Observer dùng HTTP; polling dùng WebSocket",
      "Không có sự khác biệt thực tế về performance"
    ],
    correct: 1,
    explanation: "<strong>Đúng.</strong> Polling: check file mỗi 1 giây → 60 checks/phút dù file không thay đổi. Observer: filesystem watcher → chỉ callback khi file thực sự thay đổi. Trong AI workflow: orchestrator có thể poll (check completion file mỗi N giây) hoặc observer (agent tạo event file khi xong). Polling đơn giản hơn, observer hiệu quả hơn."
  },
  {
    part: 2,
    text: 'GitOps là gì và nguyên tắc cốt lõi của nó là gì?',
    options: [
      "Git workflow với branch protection rules và mandatory code reviews",
      "Git repository là single source of truth cho cả code lẫn infrastructure config — mọi thay đổi hệ thống đều qua git commit/PR, automated system sync thực tế với desired state trong git",
      "Automation tools tích hợp với GitHub API",
      "Best practices cho commit messages và branching strategy"
    ],
    correct: 1,
    explanation: "<strong>Đúng.</strong> GitOps: muốn deploy version 2.0 → update config trong git → CD pipeline detect thay đổi → apply automatically. Không SSH vào server manual. Audit trail = git history. Rollback = git revert. Trong workflow system: toàn bộ workflow state trong git = GitOps for AI workflows. Desired state (ROADMAP.md) và actual state (STATE.md) đều tracked trong git."
  }
];

// ── State ──
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let answered = new Array(QUESTIONS.length).fill(false);

// ── DOM refs ──
const $area    = document.getElementById('question-area');
const $counter = document.getElementById('q-counter');
const $stag    = document.getElementById('q-section-tag');
const $slabel  = document.getElementById('section-label-wrap');
const $fill    = document.getElementById('progress-fill');
const $prev    = document.getElementById('btn-prev');
const $next    = document.getElementById('btn-next');
const $quiz    = document.getElementById('quiz-screen');
const $score   = document.getElementById('score-screen');

function renderQuestion(idx) {
  const q = QUESTIONS[idx];
  const isLast = idx === QUESTIONS.length - 1;

  // Progress
  $counter.textContent = `Câu ${idx+1} / ${QUESTIONS.length}`;
  $stag.textContent = q.part === 1 ? 'Phần 1: Kiến thức nền tảng' : 'Phần 2: Kiến trúc cốt lõi';
  $fill.style.width = `${((idx+1)/QUESTIONS.length)*100}%`;

  // Section label break
  $slabel.innerHTML = '';
  if (idx === 0) {
    $slabel.innerHTML = `<div class="section-label">Phần 1 — Kiến thức nền tảng</div>`;
  } else if (idx === 25) {
    $slabel.innerHTML = `<div class="section-label">Phần 2 — Kiến trúc cốt lõi từ GSD</div>`;
  }

  // Nav
  $prev.style.visibility = idx === 0 ? 'hidden' : 'visible';
  $next.textContent = isLast ? 'Xem kết quả ✓' : 'Tiếp theo →';
  $next.disabled = !answered[idx];

  // Card
  const labels = ['A', 'B', 'C', 'D'];
  const chosen  = answers[idx];
  const correct = q.correct;
  const locked  = answered[idx];

  const optionsHTML = q.options.map((opt, i) => {
    let cls = 'option';
    if (locked) {
      if (i === correct) cls += ' correct';
      else if (i === chosen && i !== correct) cls += ' wrong';
      else cls += ' dimmed';
    } else if (i === chosen) cls += ' selected';
    return `<div class="${cls}" onclick="selectOption(${idx},${i})">
      <span class="opt-label">${labels[i]}</span>
      <span class="opt-text">${opt}</span>
    </div>`;
  }).join('');

  let expHTML = '';
  if (locked) {
    const isCorrect = chosen === correct;
    expHTML = `<div class="explanation ${isCorrect?'':'wrong-exp'}">
      ${isCorrect ? '✓ ' : '✗ Đáp án đúng là <strong>' + labels[correct] + '</strong>. '}
      ${q.explanation}
    </div>`;
  }

  $area.innerHTML = `
    <div class="question-card">
      <div class="q-index">Câu ${idx+1}</div>
      <div class="q-text">${q.text}</div>
      <div class="options">${optionsHTML}</div>
      ${expHTML}
    </div>`;
}

function selectOption(qIdx, optIdx) {
  if (answered[qIdx]) return;
  answers[qIdx] = optIdx;
  answered[qIdx] = true;
  $next.disabled = false;
  renderQuestion(qIdx);
}

$next.addEventListener('click', () => {
  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion(current);
    window.scrollTo({top:0, behavior:'smooth'});
  } else {
    showScore();
  }
});

$prev.addEventListener('click', () => {
  if (current > 0) { current--; renderQuestion(current); window.scrollTo({top:0,behavior:'smooth'}); }
});

function showScore() {
  $quiz.style.display = 'none';
  $score.style.display = 'block';

  const correct = answers.filter((a,i)=>a===QUESTIONS[i].correct).length;
  const wrong   = QUESTIONS.length - correct;
  const pct     = correct / QUESTIONS.length;

  document.getElementById('score-big').textContent = correct;
  document.getElementById('bd-correct').textContent = correct;
  document.getElementById('bd-wrong').textContent   = wrong;

  // Arc
  const arc = document.getElementById('score-arc');
  const circum = 377;
  arc.style.stroke = pct >= .7 ? 'var(--green)' : pct >= .5 ? 'var(--amber)' : 'var(--red)';
  setTimeout(()=>{ arc.style.strokeDashoffset = circum*(1-pct); }, 100);

  // Title
  let title, sub;
  if (pct >= .9)      { title='Xuất sắc! 🎯'; sub='Mày nắm vững cả 2 phần. Sẵn sàng bắt tay xây dựng.'; }
  else if (pct >= .7) { title='Tốt lắm! 👍'; sub='Nền tảng vững. Một số điểm kiến trúc cần ôn thêm.'; }
  else if (pct >= .5) { title='Cần ôn thêm 📚'; sub='Hiểu cơ bản nhưng chưa sẵn sàng implement. Đọc lại phần giải thích.'; }
  else                { title='Tiếp tục ôn tập 💪'; sub='Quay lại đọc lý thuyết rồi làm lại bài này.'; }

  document.getElementById('score-title').textContent = title;
  document.getElementById('score-sub').textContent   = sub;

  // Review list
  const labels = ['A','B','C','D'];
  const list = document.getElementById('review-list');
  list.innerHTML = QUESTIONS.map((q,i)=>{
    const ok = answers[i] === q.correct;
    const chosenLabel = answers[i]!=null ? labels[answers[i]] : '–';
    const correctLabel = labels[q.correct];
    return `<div class="review-item ${ok?'r-correct':'r-wrong'}">
      <span class="ri-icon">${ok?'✓':'✗'}</span>
      <div>
        <div class="ri-q">Câu ${i+1}: ${q.text.substring(0,70)}${q.text.length>70?'…':''}</div>
        <div class="ri-ans">${ok ? 'Đúng — '+labels[q.correct] : `Chọn ${chosenLabel} → Đáp án đúng: ${correctLabel}`}</div>
      </div>
    </div>`;
  }).join('');
}

function restartQuiz() {
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  answered = new Array(QUESTIONS.length).fill(false);
  $score.style.display = 'none';
  $quiz.style.display  = 'block';
  renderQuestion(0);
  window.scrollTo({top:0,behavior:'smooth'});
}

// Init
renderQuestion(0);
</script>
</body>
</html>
